<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smooth Application has moved</title>
<meta http-equiv="refresh" content="0; url=https://smoothapplication.com">
<link rel="canonical" href="https://smoothapplication.com">
<style>
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 480px;
    margin: 96px auto;
    padding: 0 24px;
    text-align: center;
    color: #12232e;
  }
  a.btn {
    display: inline-block;
    margin-top: 16px;
    background: #0b7a6e;
    color: #fff;
    padding: 12px 24px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
  }
  p { color: #566a76; line-height: 1.5; }
</style>
</head>
<body>
  <!-- This page (the old GitHub Pages checklist) is retired. Every fix, every country, and every
       feature built since is only on smoothapplication.com now - this file is deliberately kept as
       a redirect, not deleted, so an old bookmark or shared link still lands somewhere useful
       instead of a broken page. See CHANGELOG.md for why this existed as a live, un-updated
       duplicate for as long as it did. -->
  <h1>We've moved!</h1>
  <p>Smooth Application now lives at <strong>smoothapplication.com</strong> — this page is outdated and no longer maintained. You should be redirected automatically in a moment.</p>
  <a class="btn" href="https://smoothapplication.com">Go to Smooth Application →</a>
  <script>
    // Direct user report, with a screenshot: this origin still served the FULL retired app to a
    // browser that had already installed the old app-shell service worker, well after this page
    // was replaced with a redirect - the server-side change alone never reaches a browser a
    // service worker is already controlling. Re-registering the SAME script URL here forces this
    // visit to check that worker for updates immediately (rather than waiting on the browser's own
    // periodic check); sw.js is now a kill switch that clears every cache, unregisters itself, and
    // re-navigates every open tab - see sw.js's own comment for the full story. Harmless for a
    // browser that never had the old worker: registration just resolves to a no-op kill switch.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () { /* best-effort only */ });
    }
    window.location.replace('https://smoothapplication.com');
  </script>
</body>
</html>
