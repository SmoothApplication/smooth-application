name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pii-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install poppler-utils (pdftotext, needed to scan PDF fixtures for leaked PII)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Scan for known PII leaks
        run: npm run pii-scan
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright's Chromium build
        run: npx playwright install --with-deps chromium

      - name: Run test suite
        run: npm test
