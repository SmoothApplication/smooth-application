name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pii-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install poppler-utils (pdftotext, needed to scan PDF fixtures for leaked PII)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Scan for known PII leaks
        run: npm run pii-scan
  # Repo-root check: the retired index.html redirect page + its service-worker kill switch still
  # do their one job. Plain Node, no browser — see tests/README.md for why this replaced the old
  # 142-file Playwright suite (that suite tested the pre-redirect app, which no longer exists here).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run redirect + service-worker kill-switch check
        run: npm test

  # The real, current app (smoothapplication.com) lives in web/ — this is its actual test coverage.
  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Jest suite
        run: npx jest
